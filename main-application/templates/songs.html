{% extends "base.html" %}

{% block content %}
<div class="container">
  {% for song in songs %}
  <div class="row justify-content-end section-bg mb-3 py-3">
    <div class="col">
      <h3>{{ song.title }}</h3>
      <p class="multiline">{{ song.lyrics }}</p>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
