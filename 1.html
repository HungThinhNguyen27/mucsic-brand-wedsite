<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyrics</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 30px;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .lyrics {
            font-size: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
            /* Preserve whitespace and line breaks */
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="title">Cơn Mưa Ngang Qua</div>
        <div class="lyrics">
            Cơn mưa ngang qua, làm ướt mái tóc em, khiến tim anh bồi hồi.
            Ngày hôm nay, anh chỉ muốn bên em, cùng nhau đi dưới mưa.
        </div>
    </div>
</body>

</html>
